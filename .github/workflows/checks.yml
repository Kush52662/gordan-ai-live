name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install:apps
      - run: pnpm check:web && pnpm check:agent
      - run: pnpm lint:web && pnpm lint:agent
      - run: pnpm test
      - run: pnpm build:web
